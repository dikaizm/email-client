{% extends 'base.html' %} {% load static %} {% block body %}
{% include 'nav.html' %}

<div id="compose-view" class="container">
  <h3 class="text-center mb-4">New Email</h3>
  <div id="compose-message"></div>

  <div class="form-group row mb-4 d-flex align-items-center">
    <label for="" class="col-sm-2 col-form-label"></label>
    <div class="col-sm-10 d-flex align-items-center" style="gap: 2rem">
      <div class="form-check form-switch">
        <label for="compose-encrypt" class="form-check-label">Encrypt</label>
        <input
          type="checkbox"
          role="switch"
          id="compose-encrypt"
          class="form-check-input"
        />
      </div>

      <div class="form-check form-switch">
        <label for="compose-sign" class="form-check-label"
          >Digitally Sign</label
        >
        <input
          type="checkbox"
          role="switch"
          id="compose-sign"
          class="form-check-input"
        />
      </div>

      <div id="passphrase-input"></div>
    </div>
  </div>

  <form id="compose-form">
    <div class="form-group row mb-4">
      <label for="from" class="col-sm-2 col-form-label">From</label>
      <div class="col-sm-10">
        <input
          disabled
          id="compose-from"
          class="form-control"
          value="{{ request.user.email }}"
        />
      </div>
    </div>
    <div class="form-group row mb-4">
      <label for="from" class="col-sm-2 col-form-label">To</label>
      <div class="col-sm-10">
        <input id="compose-recipients" class="form-control" />
        <small class="text-muted"
          >Separate multiple recipients with commas.</small
        >
        <div id="recipient-msg" class="small"></div>
      </div>
    </div>
    <div class="form-group row mb-4">
      <label for="from" class="col-sm-2 col-form-label">Subject</label>
      <div class="col-sm-10">
        <input id="compose-subject" class="form-control" />
      </div>
    </div>
    <div class="form-group row mb-4">
      <label for="from" class="col-sm-2 col-form-label">Message</label>
      <div class="col-sm-10">
        <textarea id="compose-body" class="form-control" rows="10"></textarea>
      </div>
    </div>

    <div class="form-group row">
      <label for="" class="col-sm-2 col-form-label"></label>
      <div class="col-sm-10">
        <div class="text-danger small" id="compose-error"></div>

        <div class="d-grid gap-2">
          <button class="btn btn-primary mb-4" type="submit" id="compose-send">
            Send
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
{% endblock %} {% block script %}
<script src='{% static "js/compose.js" %}'></script>
{% endblock %}
